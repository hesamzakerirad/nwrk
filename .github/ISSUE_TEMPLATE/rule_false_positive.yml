name: Rule false positive
description: A finding or hypothesis was wrong, or a real problem produced no finding.
labels: [rule, accuracy]
body:
  - type: input
    id: rule
    attributes:
      label: Rule ID
      description: For example `TCP_CONNECTION_TIMEOUT`.
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: What went wrong
      options:
        - The finding fired but the target was fine (false positive)
        - A real problem produced no finding (missed)
        - The explanation or hypothesis was misleading
        - The wording is unclear or not technical enough
    validations:
      required: true
  - type: textarea
    id: report
    attributes:
      label: The report
      description: Paste `nw diagnose <target> --output json` with private details removed.
      render: json
    validations:
      required: true
  - type: textarea
    id: truth
    attributes:
      label: What you know to be true
      description: How did you establish that the target was fine, or what the real cause was?
    validations:
      required: true
