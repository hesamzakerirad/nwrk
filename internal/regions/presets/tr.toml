# The tr preset: the global set plus domestic anchors, so a report can say
# that domestic reachability works while international reachability does
# not, or the other way round.
#
# Anchors are large, long-lived sites of different operators and sectors,
# chosen for stability and neutrality. They are ordinary commercial or public
# services, unrelated to circumvention and to political content. No domestic
# resolver is shipped: none could be verified as both stable and neutral by
# the maintainers, so add the ones you trust with --resolver, NW_RESOLVERS
# or the config file. The anchors were checked for a response from outside the region. Reviewers: please check these anchors from
# inside the region before each release.

name = "tr"
description = "The global preset plus domestic anchors for Turkey, to tell local, domestic and international failures apart."
includes = ["global"]

[[targets]]
url = "https://www.turkiye.gov.tr/"
name = "e-Devlet"
scope = "domestic"
reason = "The national public services portal; long-lived and heavily used."

[[targets]]
url = "https://www.hurriyet.com.tr/"
name = "Hurriyet"
scope = "domestic"
reason = "A large domestic news site; a different sector and operator from the other anchors."

[[targets]]
url = "https://www.garantibbva.com.tr/"
name = "Garanti BBVA"
scope = "domestic"
reason = "A large domestic bank; a different sector and operator from the other anchors."
