flow_title = "هر لایه، به ترتیب"
flow_text = "/nw لایه‌های DNS، TCP، TLS و HTTP را پشت سر هم بررسی می‌کند. وقتی لایه‌ای شکست بخورد، لایه‌های بالاتر با ذکر دلیل رد می‌شوند، تا ببینید مسیر کجا قطع می‌شود و نه یک خطای مبهم."
