features_title = "nw برای چه کاری است"
f1_title = "همه لایه‌ها، به ترتیب"
f1_text = "DNS، TCP، TLS و HTTP پشت سر هم بررسی می‌شوند؛ پس به جای یک خطای نامفهوم می‌بینید کدام مرحله مشکل دارد."
f2_title = "اول شواهد، بعد توضیح"
f2_text = "هر یافته به اندازه‌گیری‌هایی که پشت آن است اشاره می‌کند. مشاهده از فرضیه جدا می‌شود و یک تایم‌اوت به‌تنهایی هرگز به معنی مسدود شدن گزارش نمی‌شود."
f3_title = "ریزالور را خودتان انتخاب کنید"
f3_text = "با گزینه <code>--resolver</code> ریزالور سیستم را با هر ریزالوری که انتخاب می‌کنید مقایسه کنید و دسترسی محلی، داخلی و بین‌المللی را جداگانه ببینید."
f4_title = "محلی و خصوصی"
f4_text = "یک فایل اجرایی واحد برای لینوکس، مک و ویندوز. اندازه‌گیری‌ها روی دستگاه شما می‌مانند، مگر اینکه خودتان آن‌ها را خروجی بگیرید."

status_title = "پروژه الان کجاست"
