c_doctor = "این دستگاه و سپس مقصدهای مرجع یک منطقه را بررسی می‌کند و می‌گوید شکست محلی است، داخلی یا بین‌المللی."
c_interference = "resolverها، دست‌دهی‌های TLS بر پایه نام سرور و http در برابر https را مقایسه می‌کند و می‌گوید چه چیز دیگری هر تفاوت را توضیح می‌دهد."
