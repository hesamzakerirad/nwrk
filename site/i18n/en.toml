flow_title = "Every layer, in order"
flow_text = "/nw tests DNS, TCP, TLS and HTTP in that order. If one layer fails, it skips the layers after it and tells you why. You see where the connection breaks, not just a generic error."
l_dns = "Asks the system resolver, and any resolver you choose, for A and AAAA records."
l_tcp = "Connects to each address. IPv4 and IPv6 are tested separately."
l_tls = "Checks the certificate chain and the server name. Certificate checks are always on."
l_http = "Sends one request with a time limit and times each stage."

cmds_title = "Commands for common network problems"
cmds_lead = "Start with the question you have. Each command answers one."
q_diagnose = "A site won't load. Where does it break?"
q_doctor = "Is it my network, my country or the site?"
q_interference = "Is something on the path tampering with my connection?"
q_test = "Is my DNS server the problem?"
q_path = "Where do my packets stop?"
q_network = "How does this machine connect?"
c_diagnose = "Tests DNS, TCP, TLS and HTTP in order and names the layer that failed."
c_doctor = "Checks this machine first, then reference sites for a region. Tells you whether the problem is local, in your country or international."
c_interference = "Compares resolvers, TLS handshakes by server name, and http with https. Lists other possible causes for each difference."
c_test = "Runs a single measurement. A resolver can be plain, tcp://, tls:// or https://."
c_path = "Ping, trace and MTU hints. Uses ICMP where allowed and TCP where not."
c_network = "Lists your interfaces, routes, DNS servers and proxies. Sends nothing."
cmds_link = "Every command and flag"

ev_title = "Evidence, not guesses"
ev_lead = "From one machine, a timeout and a block can look identical. /nw reports what it measured, what could explain it, and what it did not check."
ev_finding = "What was observed, such as tls.cert_expired. The same measurements always give the same finding."
ev_hypothesis = "A possible explanation, such as an expired certificate or a wrong clock on your machine. It is labeled as a possibility, never as a conclusion."
ev_gap = "Every hypothesis lists what was not checked, so you know what to test next."
ev_confidence = "One measurement is never enough for high confidence."
ev_link = "How findings are made"

rules_title = "What /nw will not do"
rules_lead = "Everything runs on your machine. These limits are fixed, not settings."
r1 = "Upload anything without asking. There is no account and no telemetry. Sharing results is a separate command that asks twice."
r3 = "Skip certificate checks, or record cookies, page bodies or credentials."
r4 = "Change your system. It does not touch DNS settings, proxies, firewall rules or routes."
rules_link = "Read the privacy notes"


comm_title = "Community measurements"
comm_lead = "Which services work from which networks in Iran? One machine cannot answer that. Many machines can."
comm_text = "If you want to help, run nw community contribute. nw measures a fixed list of public services, shows you the exact result, and uploads it only if you agree. It never runs in the background. nw community contribute --dry-run measures and shows the result without contacting the server."
comm_data = "The upload holds the check type, the IP version, the outcome and the time. It holds no IP address, URL or device ID. The server stores the country and network (ASN) of your connection, not your address."
comm_docs = "How contributing works"
comm_dash = "Open the dashboard"

