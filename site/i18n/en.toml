flow_title = "Every layer, in order"
flow_text = "/nw checks DNS, TCP, TLS and HTTP in sequence. When a layer fails, the layers above it are skipped with the reason, so you see where the path breaks instead of one opaque error."
l_dns = "Asks the system resolver, and any you choose, for A and AAAA records."
l_tcp = "Connects to each address, IPv4 and IPv6 separately."
l_tls = "Verifies the certificate chain and the name. Verification is never switched off."
l_http = "Makes one bounded request and times every stage."

cmds_title = "Commands for common network problems"
cmds_lead = "Pick the question you have. Each command answers one."
q_diagnose = "A site will not load. Where does it break?"
q_doctor = "Is it my network, my country or the site?"
q_interference = "Is something on the path tampering with the connection?"
q_test = "Is my DNS server the problem?"
q_path = "Where do my packets stop?"
q_network = "What does this machine use to connect?"
c_diagnose = "Runs DNS, TCP, TLS and HTTP in order and names the layer that failed."
c_doctor = "Checks this machine, then a region's reference targets, and says whether the failure is local, domestic or international."
c_interference = "Compares resolvers, TLS handshakes by server name, and http with https. Lists what else could explain each difference."
c_test = "Runs one measurement. Resolvers can be plain, tcp://, tls:// or https://."
c_path = "Ping, trace and MTU hints. Uses ICMP where permitted and TCP where not."
c_network = "Lists interfaces, routes, DNS servers and proxies. Sends nothing."
cmds_link = "Every command and flag"

ev_title = "Evidence before conclusions"
ev_lead = "A timeout and a block look the same from one machine. /nw reports what it measured, then what could explain it, and says what it did not check."
ev_finding = "What was observed, such as tls.cert_expired. The same measurements always give the same finding."
ev_hypothesis = "What could explain it, such as an expired certificate or a wrong local clock. A hypothesis is never stated as a conclusion."
ev_gap = "Each hypothesis lists what was not checked, so you know what to test next."
ev_confidence = "A single measurement never earns high confidence."
ev_link = "How findings are made"

rules_title = "What /nw will not do"
rules_lead = "Local-first by design. These limits are part of the tool, not settings."
r1 = "Upload anything. There is no account, no server and no telemetry."
r3 = "Skip certificate verification, or record cookies, bodies and credentials."
r4 = "Change your system. No DNS setting, proxy, firewall rule or route is touched."
rules_link = "Read the privacy notes"


