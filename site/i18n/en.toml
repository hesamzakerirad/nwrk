features_title = "What nw is for"
f1_title = "Every layer, in order"
f1_text = "DNS, TCP, TLS and HTTP are checked in sequence, so you see which stage fails instead of one opaque error."
f2_title = "Evidence, then explanation"
f2_text = "Each finding points to the measurements behind it. Observations are kept apart from hypotheses, and a timeout is never called a block on its own."
f3_title = "Your resolver, your choice"
f3_text = "Compare the system resolver with any resolver you pick using <code>--resolver</code>, and see local, domestic and international reachability separately."
f4_title = "Local and private"
f4_text = "A single binary for Linux, macOS and Windows. Measurements stay on your machine unless you export them yourself."

status_title = "Where the project is"
status_lead = "Today, nw can print its version and generate shell completions. The diagnostic commands arrive step by step; each step ships as a signed release."
