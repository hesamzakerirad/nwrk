flow_title = "Every layer, in order"
flow_text = "nw checks DNS, TCP, TLS and HTTP in sequence. When a layer fails, the layers above it are skipped with the reason, so you see where the path breaks instead of one opaque error."
l_dns = "Asks the system resolver, and any you choose, for A and AAAA records."
l_tcp = "Connects to each address, IPv4 and IPv6 separately."
l_tls = "Verifies the certificate chain and the name. Verification is never switched off."
l_http = "Makes one bounded request and times every stage."

cmds_title = "What you can run"
c_diagnose = "Check a destination layer by layer and explain what the evidence shows."
c_doctor = "Check this machine, then tell local, domestic and international failures apart."
c_interference = "Compare resolvers, handshakes and http with https, and list what else could explain each difference."
c_test = "Run one measurement. Resolvers can be plain, tcp://, tls:// or https://."
c_path = "Ping, trace and MTU hints; ICMP where permitted, TCP where not."
c_network = "Show interfaces, routes, DNS servers and proxies. Nothing is sent."
cmds_link = "All commands and flags"

rules_title = "What nw will not do"
r1 = "Upload anything. There is no account, no server and no telemetry."
r2 = "Call a timeout a block. Findings say what was seen; hypotheses say what could explain it and what was not checked."
r3 = "Skip certificate verification, or record cookies, bodies and credentials."
r4 = "Change your system: no DNS, proxy, firewall or route is touched."
r5 = "Report high confidence from a single measurement."

