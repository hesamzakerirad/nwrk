version: 2

project_name: nwrk

builds:
  - id: nw
    main: ./cmd/nw
    binary: nw
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/radestsam/nwrk/internal/buildinfo.Version={{ .Version }}
      - -X github.com/radestsam/nwrk/internal/buildinfo.Commit={{ .ShortCommit }}
      - -X github.com/radestsam/nwrk/internal/buildinfo.Date={{ .Date }}

archives:
  - id: nw
    ids: [nw]
    name_template: "nw_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

# Keyless signing through GitHub Actions OIDC. Verify with the command in
# docs/install.md.
signs:
  - cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"
    output: true

# Release notes come from CHANGELOG.md. See scripts/release-notes.sh.
changelog:
  disable: true

release:
  github:
    owner: radestsam
    name: nwrk
  prerelease: auto
